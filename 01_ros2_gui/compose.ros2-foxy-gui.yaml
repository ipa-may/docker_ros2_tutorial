name: docker-ros2-foxy-gui
services:
  ros2_foxy_gui:
    #image: osrf/ros:humble-desktop
    build:
      context: .
      dockerfile: ./Dockerfile-foxy-gui
    stdin_open: true
    tty: true
    network_mode: host
    ipc: host
    user: ros
    environment:
      - DISPLAY=$DISPLAY
      - QT_X11_NO_MITSHM=1
      # - NVIDIA_DRIVER_CAPABILITIES=all
      # - NVIDIA_VISIBLE_DEVICES=all
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../src:/home/ros/ros2_ws/src
    command: "bash -c 'source /opt/ros/foxy/setup.bash && exec $SHELL'"

