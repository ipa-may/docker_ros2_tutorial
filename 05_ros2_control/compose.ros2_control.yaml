 # Note: Run `xhost +local:docker` on the host before starting this container
name: docker-ros2-control-demos-custom
services:
  ros2_control_demos_custom:
    build:
      context: .
      dockerfile: ./Dockerfile-ros2-control
    stdin_open: true
    tty: true
    network_mode: host
    ipc: host
    user: ros
    environment:
      - DISPLAY=$DISPLAY
      - QT_X11_NO_MITSHM=1
      # - NVIDIA_DRIVER_CAPABILITIES=all
      # - NVIDIA_VISIBLE_DEVICES=all
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../../src:/home/ros/ros2_ws/src
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash && exec bash"

  ros2_control_demos_custom_rt:
    build:
      context: .
      dockerfile: ./Dockerfile-ros2-control
    stdin_open: true
    tty: true
    network_mode: host
    ipc: host
    user: ros
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      memlock: -1
      nice: -20
    environment:
      - DISPLAY=$DISPLAY
      - QT_X11_NO_MITSHM=1
      # - NVIDIA_DRIVER_CAPABILITIES=all
      # - NVIDIA_VISIBLE_DEVICES=all
    #devices: # linux only
    #  - /dev/dri:/dev/dri
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../../src:/home/ros/ros2_ws/src
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash && exec bash"
